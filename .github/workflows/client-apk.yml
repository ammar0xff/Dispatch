name: client-apk

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-apk.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install client dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Android APK (release)
        working-directory: client
        run: flutter build apk --release

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-${{ github.run_number }}
          name: "Client release #${{ github.run_number }}"
          body: |
            Auto-built agent APK from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Triggered by commit `${{ github.event.head_commit.message }}`.
          files: client/build/app/outputs/flutter-apk/app-release.apk