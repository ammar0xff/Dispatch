name: admin-apk

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin-apk.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install admin dependencies
        working-directory: admin
        run: flutter pub get

      - name: Build Android APK (release)
        working-directory: admin
        run: flutter build apk --release

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-${{ github.run_number }}
          name: "Supervisor release #${{ github.run_number }}"
          body: |
            Auto-built supervisor APK from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Triggered by commit `${{ github.event.head_commit.message }}`.
          files: admin/build/app/outputs/flutter-apk/app-release.apk