name: client-web

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "landing/**"
      - ".github/workflows/client-web.yml"

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install client dependencies
        working-directory: client
        run: flutter pub get

      - name: Build client web
        working-directory: client
        run: flutter build web --release --base-href /Dispatch/client/

      - name: Prepare deploy directory
        run: |
          mkdir -p _site/client
          cp -r client/build/web/* _site/client/
          mkdir -p _site
          cp landing/index.html _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: true
