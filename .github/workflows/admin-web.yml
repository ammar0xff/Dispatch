name: admin-web

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin-web.yml"

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install admin dependencies
        working-directory: admin
        run: flutter pub get

      - name: Build admin web
        working-directory: admin
        run: flutter build web --release

      - name: Deploy to GitHub Pages (/admin)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: admin/build/web
          destination_dir: admin
          keep_files: true